events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS — resolves container names at request time,
    # not at startup. This lets nginx start before backends are ready.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto https;
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        $connection_upgrade;
    proxy_read_timeout  300s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        set $backend http://librenms:8000;
        location / { proxy_pass $backend; }
    }

    server {
        listen 3000 ssl;
        set $backend http://grafana:3000;
        location / { proxy_pass $backend; }
    }

    server {
        listen 8080 ssl;
        set $backend http://akvorado-console:8080;
        location / { proxy_pass $backend; }
    }

    server {
        listen 8888 ssl;
        set $backend http://oxidized:8888;
        location / { proxy_pass $backend; }
    }
}
